<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Practice</title>
    <style>
        *{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #main{
            padding: 5px;
            max-width: 100%;
            max-height: 100%
        }
        #cards{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
            max-width: 1000px;
        }
        input{
            margin: 5px;
            display: block;
            border: 1px solid;
            border-radius: 5px;
            font-size: large;
            padding: 5px 10px;
        }
        input::placeholder{
            font-family: Georgia, 'Times New Roman', serif;
        }
        .card{
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 18px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover{
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.12);
        }
        .pfp{
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #f3f4f6;
            margin-bottom: 6px;
        }
        .pfp img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card h2{
            margin: 4px 0 0;
            font-size: 24px;
            color: #111827;
        }
        .card h3{
            margin: 0;
            font-size: 16px;
            font-weight: 500;
            color: #4f46e5;
        }
        .desc{
            margin: 6px 0 0;
            line-height: 1.5;
            color: #4b5563;
        }
        @media (max-width: 520px){
            input{
                width: 100%;
                box-sizing: border-box;
            }
            #cards{
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="name">
            <input type="text" placeholder="profile pic">
            <input type="text" placeholder="occupation">
            <input type="text" placeholder="description">
            <input type="submit">
        </form>
        <div id="cards"></div>
    </div>

</body>
</html>
